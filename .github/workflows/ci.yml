name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyproject.toml pins requires-python to 3.12.x.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          # openai-whisper's setup.py needs pkg_resources, removed in setuptools>=81.
          pip install "setuptools<81" wheel
          pip install --no-build-isolation openai-whisper==20240930
          pip install -e . --group dev

      - name: Lint
        run: ruff check src/

      - name: Run tests
        run: python -m pytest -q -rs
