[project]
name = "ai-video-editor"
version = "0.1.0"
description = "AI-powered production pipeline for cinematic cycling POV videos"
readme = "README.md"
authors = [
    { name = "Parakh20", email = "sharmaparakh05@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-python==4.10.0.84",
    "numpy==2.1.3",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "torchaudio==2.5.1",
    "openai-whisper==20240930",
    "ffmpeg-python==0.2.0",
    "scenedetect==0.6.5.2",
    "opentimelineio==0.17.0",
    "librosa==0.10.2.post1",
    "moviepy==1.0.3",
    "gpxpy==1.6.2",
    "fitparse==1.2.0",
    "rich==13.9.4",
    "typer==0.13.1",
    "click<8.2",  # typer 0.13.x's rich help renderer breaks on click>=8.2 (Parameter.make_metavar signature change)
    "tqdm==4.67.1",
    "pandas==2.2.3",
    "scikit-image==0.24.0",
    "scikit-learn==1.5.2",
    "pillow==11.0.0",
    "onnxruntime==1.20.1",
    "matplotlib==3.9.3",
    "pydantic==2.10.3",
    "pyyaml==6.0.2",
]

[project.scripts]
video-editor = "ai_video_editor.cli.main:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.extra-build-dependencies]
# openai-whisper's legacy setup.py imports pkg_resources at build time but
# doesn't declare it; setuptools>=81 split pkg_resources out, so pin an
# older setuptools that still bundles it just for this build step.
openai-whisper = ["setuptools<81"]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-PyYAML==6.0.12.20240917",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: heavier tests (e.g. model loading) that may take several seconds",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
